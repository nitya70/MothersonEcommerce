<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Profile Page</title>
<link rel="stylesheet"
      href="css/header.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    background:#f3f4f6;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.profile-container{

    width:420px;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

.profile-image{

    width:120px;
    height:120px;

    border-radius:50%;

    display:block;

    margin:auto;

    object-fit:cover;

    border:4px solid #2563eb;

    margin-bottom:25px;
}

h1{

    text-align:center;

    margin-bottom:25px;

    color:#111827;
}

.form-group{

    margin-bottom:18px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

    color:#111827;
}

input,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:15px;
}

textarea{

    resize:none;
}

.button-group{

    display:flex;

    gap:10px;

    margin-top:25px;
}

button{

    flex:1;

    padding:12px;

    border:none;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

    color:white;
}

.save-btn{

    background:#2563eb;
}

.back-btn{

    background:#111827;
}

.save-btn:hover{

    background:#1d4ed8;
}

.back-btn:hover{

    background:black;
}

</style>

</head>

<body>
    <div id="header"></div>

<div class="profile-container">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         class="profile-image">

    <h1>
        User Profile
    </h1>

    <!-- USERNAME -->

    <div class="form-group">

        <label>
            Username
        </label>

        <input type="text" id="name" readonly>
    </div>

    <!-- EMAIL -->

    <div class="form-group">

        <label>
            Email
        </label>

        <input type="email" id="email" readonly>
    </div>

    <!-- PHONE -->

    <div class="form-group">

        <label>
            Phone Number
        </label>

        <input type="text"
               id="phone">
    </div>

    <!-- ADDRESS -->

    <div class="form-group">

        <label>
            Address
        </label>

        <textarea id="address"
                  rows="4"></textarea>
    </div>

    <!-- BUTTONS -->

    <div class="button-group">

        <button class="save-btn"
                onclick="saveProfile()">

            Save

        </button>

        <button class="back-btn"
                onclick="goBack()">

            Back

        </button>

    </div>

</div>
<script src="js/header.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
