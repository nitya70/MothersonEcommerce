<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Motherson Store</title>

<link rel="stylesheet"
      href="css/header.css">

<link rel="stylesheet"
      href="css/products.css">

</head>
<style>
.wishlist-icon{

    position:absolute;

    top:15px;
    right:15px;

    font-size:24px;

    cursor:pointer;
}
.product-card{
    position:relative;
}
.view-btn{

    flex:1;

    padding:10px;

    border:none;

    border-radius:8px;

    color:white;

    cursor:pointer;
}

.view-btn{

    background:#2563eb;
}
.view-btn:hover{

    background:#1d4ed8;
}
</style>

<body>

<div id="header"></div>

<!-- CONTROLS -->

<div class="controls">

    <div class="search-box">

        <input type="text"
               id="searchInput"
               placeholder="Search Products..."
               onkeyup="searchProducts()">

    </div>

    <div class="filter-group">

        <select id="priceFilter"
                onchange="filterProducts()">

            <option value="all">
                All Prices
            </option>

            <option value="low">
                Below ₹500
            </option>

            <option value="medium">
                ₹500 - ₹2000
            </option>

            <option value="high">
                Above ₹2000
            </option>

        </select>

        <select id="sortFilter"
                onchange="sortProducts()">

            <option value="default">
                Sort By
            </option>

            <option value="lowToHigh">
                Price Low To High
            </option>

            <option value="highToLow">
                Price High To Low
            </option>

        </select>

    </div>

</div>

<!-- PRODUCTS -->

<div id="products"></div>

<!-- LOAD HEADER -->

<script>

fetch("./header.html")
.then(response => response.text())
.then(data => {

    document.getElementById("header")
            .innerHTML = data;
    updateCartCount();
    updateWishlistCount();
    updateOrderCount();
});

</script>

<script src="js/header.js"></script>

<script src="js/product.js"></script>

</body>

</html>
