<!DOCTYPE html>
<html>

<head>
<title>Motherson Product Store</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:black;
color:white;
text-align:center;
padding:15px;
font-size:22px;
}

#products{
display:grid;
grid-template-columns: repeat(4,1fr);
gap:20px;
padding:30px;
}

.product-card{
background:white;
border-radius:10px;
padding:15px;
text-align:center;
box-shadow:0px 0px 8px rgba(0,0,0,0.2);
}

.product-card img{
width:200px;
height:150px;
object-fit:contain;
}

.product-card h3{
font-size:18px;
margin:10px 0;
}

.price{
color:green;
font-size:18px;
font-weight:bold;
}

.rating{
color:orange;
}

button{
background:black;
color:white;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#444;
}

</style>

</head>

<body>

<div class="header">
Motherson Product Store
</div>

<div id="products">

</div>

<script src="js/script.js"></script>
<script>
loadProducts()
</script>
</body>
</html>
