<!DOCTYPE html>
<html>

<head>
<title>Motherson Product</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:black;
color:white;
text-align:center;
padding:15px;
font-size:22px;
}

.product-container{
display:flex;
gap:40px;
padding:40px;
max-width:1100px;
margin:auto;
background:white;
border-radius:10px;
box-shadow:0px 0px 8px rgba(0,0,0,0.2);
}

/* Product Image */

.product-image{
flex:1;
text-align:center;
}

.product-image img{
width:100%;
max-width:450px;
height:350px;
object-fit:contain;
}

/* Product Details */

.product-details{
flex:1;
}

.product-details h1{
font-size:28px;
margin-bottom:15px;
}

.price{
color:green;
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.rating{
color:orange;
margin-bottom:15px;
}

.description{
font-size:16px;
line-height:1.5;
color:#444;
margin-bottom:20px;
}

/* Buttons */

button{
background:black;
color:white;
border:none;
padding:12px 20px;
margin-right:10px;
cursor:pointer;
border-radius:5px;
font-size:16px;
}

button:hover{
background:#444;
}

</style>

</head>

<body>
<div class="header">
Motherson Product Store
</div>

<div class="product-container">

<div class="product-image">
<img id="image">
</div>

<div class="product-details">

<h1 id="productname"></h1>

<div id="price" class="price"></div>

<div id="rating" class="rating"></div>

<p id="description" class="description"></p>
<button onclick="addToCart('100')">
    Add to Cart
</button>

<button onclick="buyNow('123')">
    Buy Now
</button>


</div>
</div>

<script src="js/script.js"></script>
<script src="js/product.js"></script>
<script>
loadProductDetails()
</script>
</body>
</html>
