<!DOCTYPE html>
<html>

<head>

<title>Motherson Product</title>

<link rel="stylesheet"
      href="css/header.css">

<style>

body{
    font-family:Arial;
    margin:0;
    background:#f4f4f4;
}

.product-container{

    display:flex;
    gap:40px;

    padding:40px;

    max-width:1100px;

    margin:40px auto;

    background:white;

    border-radius:10px;

    box-shadow:0px 0px 8px rgba(0,0,0,0.2);
}

/* PRODUCT IMAGE */

.product-image{
    flex:1;
    text-align:center;
}

.product-image img{

    width:100%;
    max-width:450px;

    height:350px;

    object-fit:contain;
}

/* PRODUCT DETAILS */

.product-details{
    flex:1;
}

.product-details h1{

    font-size:28px;

    margin-bottom:15px;
}

.price{

    color:green;

    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;
}

.rating{

    color:orange;

    margin-bottom:15px;
}

.description{

    font-size:16px;

    line-height:1.5;

    color:#444;

    margin-bottom:20px;
}

/* BUTTONS */

.button-group{

    display:flex;
    gap:15px;
}

.cart-btn,
.buy-btn{

    border:none;

    padding:12px 20px;

    cursor:pointer;

    border-radius:5px;

    font-size:16px;

    color:white;
}

.cart-btn{
    background:black;
}

.buy-btn{
    background:#2563eb;
}

.cart-btn:hover{
    background:#444;
}

.buy-btn:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<!-- HEADER -->

<div id="header"></div>

<!-- PRODUCT -->

<div class="product-container">

    <div class="product-image">

        <img id="image">

    </div>

    <div class="product-details">

        <h1 id="productname"></h1>

        <div id="price"
             class="price"></div>

        <div id="rating"
             class="rating"></div>

        <p id="description"
           class="description"></p>

        <div class="button-group">

            <button class="cart-btn"
                id="cartBtn"
                    onclick="updateCartCount()">

                Add To Cart

            </button>

            <button class="buy-btn"
                    onclick="buyNow()">

                Buy Now

            </button>

        </div>

    </div>

</div>

<!-- LOAD HEADER -->

<script>

fetch("./header.html")
.then(response => response.text())
.then(data => {

    document.getElementById("header")
            .innerHTML = data;
    updateCartCount();
    updateWishlistCount();
    updateOrderCount();
});

</script>

<!-- JS FILES -->

<script src="js/header.js"></script>

<script src="js/product.js"></script>

<script>

loadProductDetails();

</script>

</body>

</html>
