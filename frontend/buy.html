<!DOCTYPE html>
<html>

<head>

<title>Buy Now</title>

<link rel="stylesheet"
      href="css/header.css">

<style>

.container{
    width:80%;
    margin:auto;
    margin-top:40px;
}

.product-box{

    display:flex;

    gap:30px;

    background:white;

    padding:20px;

    border-radius:10px;
}

.product-box img{

    width:250px;
}

.qty-box{

    margin-top:20px;
}

.qty-btn{

    width:40px;
    height:40px;
    font-size:20px;
}

.buy-btn{

    margin-top:20px;

    padding:15px 25px;

    background:#fb641b;

    color:white;

    border:none;

    cursor:pointer;
}

</style>

</head>

<body>

<div id="header"></div>

<div class="container">

    <div class="product-box">

        <img id="image">

        <div>

            <h2 id="name"></h2>

            <h3 id="price"></h3>

            <div class="qty-box">

                <button
                class="qty-btn"
                onclick="decreaseQty()">

                -

                </button>

                <span id="qty">

                    1

                </span>

                <button
                class="qty-btn"
                onclick="increaseQty()">

                +

                </button>

            </div>

            <h3>

                Total :
                ₹ <span id="total"></span>

            </h3>

            <button
            class="buy-btn"
            onclick="proceedCheckout()">

            Proceed To Checkout

            </button>

        </div>

    </div>

</div>

<script src="js/buy.js"></script>

</body>

</html>
