<!DOCTYPE html>

<html>
<head>
<title>Login</title>

<style>

body{
margin:0;
font-family:'Segoe UI', sans-serif;
background:linear-gradient(135deg,#f8be7200,#1e293b,#020617);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{

width:380px;
padding:40px;

background: rgba(255,255,255,0.08);
border-radius:15px;

backdrop-filter: blur(10px);

box-shadow:0 8px 32px rgba(0,0,0,0.4);

color:white;
}

h2{
text-align:center;
margin-bottom:30px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:rgba(255,255,255,0.1);
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#6366f1,#8b5cf6);
color:white;
font-size:16px;
cursor:pointer;
}

.link{
text-align:center;
margin-top:15px;
}

a{
color:#8b5cf6;
text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<h2>Login</h2>

<form>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button type="button" onclick="login()">Login</button>



</form>

<div class="link">
Don't have account? <a href="register.html">Register</a>
</div>

</div>
<script src="js/login.js"></script>
</body>
</html>
