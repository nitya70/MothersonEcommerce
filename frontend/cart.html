<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Cart</title>

<link rel="stylesheet"
      href="css/header.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
}

/* PAGE TITLE */

.page-title{

    text-align:center;

    margin:30px 0;

    font-size:38px;

    color:#111827;
}

/* CART CONTAINER */

#cartContainer{

    width:90%;

    max-width:1200px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:25px;
}

/* CARD */

.cart-card{

    background:white;

    border-radius:20px;

    padding:20px;

    display:flex;

    gap:25px;

    align-items:center;

    box-shadow:0 4px 15px rgba(0,0,0,0.1);

    transition:0.3s;
}

.cart-card:hover{

    transform:translateY(-5px);
}

/* IMAGE */

.cart-card img{

    width:180px;

    height:180px;

    object-fit:cover;

    border-radius:15px;

    background:#f8f8f8;
}

/* DETAILS */

.cart-details{

    flex:1;
}

.cart-details h2{

    font-size:30px;

    margin-bottom:10px;

    color:#111827;
}

.price{

    color:#16a34a;

    font-size:26px;

    font-weight:bold;

    margin-bottom:15px;
}

/* QUANTITY */

.quantity-box{

    display:flex;

    align-items:center;

    gap:15px;

    margin:15px 0;
}

.quantity-box button{

    width:40px;

    height:40px;

    border:none;

    border-radius:50%;

    background:#2563eb;

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:0.3s;
}

.quantity-box button:hover{

    background:#1d4ed8;
}

.quantity-box span{

    font-size:22px;

    font-weight:bold;

    min-width:30px;

    text-align:center;
}

/* BUTTONS */

.button-group{

    display:flex;

    gap:15px;

    margin-top:15px;
}

.remove-btn{

    background:#ef4444;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;
}

.remove-btn:hover{

    background:#dc2626;
}

.buy-btn{

    background:#2563eb;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;
}

.buy-btn:hover{

    background:#1d4ed8;
}

/* SUMMARY */

.cart-summary{

    width:350px;

    background:white;

    padding:25px;

    border-radius:15px;

    box-shadow:0 4px 15px rgba(0,0,0,0.1);

    margin:40px auto;
}

.cart-summary h2{

    margin-bottom:20px;

    color:#111827;
}

.summary-row{

    display:flex;

    justify-content:space-between;

    margin-bottom:15px;

    font-size:18px;
}

.checkout-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#111827;

    color:white;

    font-size:18px;

    cursor:pointer;

    margin-top:20px;
}

.checkout-btn:hover{

    background:black;
}

/* EMPTY CART */

.empty-cart{

    text-align:center;

    font-size:30px;

    margin-top:80px;

    color:#666;
}

</style>

</head>

<body>

<!-- HEADER -->

<div id="header"></div>

<!-- TITLE -->

<h1 class="page-title">

    My Cart

</h1>

<!-- ITEMS -->

<div id="cartContainer"></div>

<!-- SUMMARY -->

<div class="cart-summary">

    <h2>

        Price Details

    </h2>

    <div class="summary-row">

        <span>Total Items</span>

        <span id="totalItems">

            0

        </span>

    </div>

    <div class="summary-row">

        <span>Total Amount</span>

        <span>

            ₹ <span id="totalPrice">0</span>

        </span>

    </div>

    <button class="checkout-btn"
            onclick="window.location.href='checkout.html'">

        Proceed To Checkout

    </button>

</div>

<!-- HEADER -->

<script>

fetch("./header.html")
.then(response => response.text())
.then(data => {

    document.getElementById("header")
            .innerHTML = data;

    updateCartCount();

    updateWishlistCount();
});

</script>

<script src="js/header.js"></script>

<scrript src="js/products.js"></script>

<script src="js/cart.js"></script>

</body>

</html>
