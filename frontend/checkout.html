<!DOCTYPE html>
<html>

<head>

<title>Checkout</title>

<link rel="stylesheet"
      href="css/header.css">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.checkout-container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.section{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

.cart-item{
    display:flex;
    gap:20px;
    margin-bottom:15px;
}

.cart-item img{
    width:120px;
}

.price-box{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

.place-order-btn{
    background:#fb641b;
    color:white;
    border:none;
    padding:15px 30px;
    cursor:pointer;
    font-size:18px;
    margin-top:20px;
}

</style>

</head>

<body>

<div id="header"></div>

<div class="checkout-container">

    <div class="section">

        <h2>Delivery Address</h2>

        <p id="name"></p>
        <p id="email"></p>
        <p id="phone"></p>
        <p id="address"></p>

    </div>

    <div class="section">

        <h2>Order Summary</h2>

        <div id="items"></div>

    </div>

    <div class="price-box">

        <h3>Price Details</h3>

        <p>
            Total Items :
            <span id="totalItems"></span>
        </p>

        <p>
            Product Amount :
            ₹ <span id="productAmount"></span>
        </p>

        <p>
            Delivery Charge :
            ₹100
        </p>

        <h2>
            Grand Total :
            ₹ <span id="grandTotal"></span>
        </h2>

        <button
            class="place-order-btn"
            onclick="placeOrder()">

            PLACE ORDER

        </button>

    </div>

</div>
<!-- HEADER -->

<script>

fetch("./header.html")
.then(response => response.text())
.then(data => {

    document.getElementById("header")
            .innerHTML = data;

    updateCartCount();

    updateWishlistCount();
});

</script>
<script src="js/header.js"></script>
<script src="js/checkout.js"></script>


</body>

</html>
