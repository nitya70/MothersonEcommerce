<!DOCTYPE html>
<html>

<head>

<title>My Orders</title>

<link rel="stylesheet"
      href="css/header.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
}

.page-title{
    text-align:center;
    margin:20px;
}

#ordersContainer{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.order-card{

    background:white;

    padding:20px;

    margin-bottom:20px;

    border-radius:12px;

    box-shadow:
    0 2px 8px rgba(
        0,0,0,0.1
    );
}

.order-header{

    display:flex;

    justify-content:
    space-between;

    margin-bottom:15px;
}

.status{

    color:green;

    font-weight:bold;
}

.order-item{

    display:flex;

    gap:15px;

    margin-top:10px;

    padding-top:10px;

    border-top:
    1px solid #ddd;
}

.order-item img{

    width:100px;

    height:100px;

    object-fit:contain;
}

</style>

</head>

<body>

<div id="header"></div>

<h1 class="page-title">
    My Orders
</h1>

<div id="ordersContainer"></div>

<script>

fetch("./header.html")
.then(response => response.text())
.then(data => {

    document.getElementById(
        "header"
    ).innerHTML = data;

    updateCartCount();

    updateWishlistCount();
});

</script>

<script src="js/header.js"></script>
<script src="js/orders.js"></script>

</body>

</html>
