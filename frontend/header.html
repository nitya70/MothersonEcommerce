<div class="header">

    <!-- LOGO -->

    <div class="logo"
         onclick="goToProducts()">

        Motherson Store

    </div>

    <!-- ICONS -->

    <div class="icons">

        <!-- WISHLIST -->

        <div class="icon-box"
             onclick="openWishlistPage()">

            ❤️

            <span class="count"
                  id="wishlistCount">

                0

            </span>

        </div>

        <!-- ORDERS -->

        <div class="icon-box"
             onclick="openOrdersPage()">

            📦

        </div>

        <!-- CART -->

        <div class="icon-box"
             onclick="openCartPage()">

            🛒

            <span class="count"
                  id="cartCount">

                0

            </span>

        </div>

        <!-- PROFILE -->

        <div class="icon-box"
             onclick="toggleProfileMenu()">

            👤

            <div class="profile-menu"
                 id="profileMenu">

                <div onclick="openProfilePage()">

                    My Profile

                </div>

                <div onclick="openWishlistPage()">

                    Wishlist

                </div>

                <div onclick="openOrdersPage()">

                    Orders

                </div>

                <div onclick="logoutUser()">

                    Logout

                </div>

            </div>

        </div>

    </div>

</div>
