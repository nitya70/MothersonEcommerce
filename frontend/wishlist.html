<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Wishlist</title>

<link rel="stylesheet"
      href="css/header.css">
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f3f4f6;
}

/* TITLE */

.page-title{

    text-align:center;

    margin:30px 0;

    font-size:32px;

    color:#111827;
}

/* CONTAINER */

#wishlistContainer{

    width:90%;

    max-width:1200px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:20px;
}

/* CARD */

.wishlist-card{

    background:white;

    border-radius:15px;

    padding:20px;

    display:flex;

    align-items:center;

    gap:25px;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* IMAGE */

.wishlist-card img{

    width:170px;

    height:170px;

    object-fit:contain;

    background:#f9f9f9;

    border-radius:10px;
}

/* DETAILS */

.wishlist-details{

    flex:1;
}

.wishlist-details h2{

    margin-bottom:10px;

    color:#111827;
}

.price{

    color:green;

    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;
}

.rating{

    color:orange;

    margin-bottom:15px;
}

/* BUTTONS */

.button-group{

    display:flex;

    gap:10px;
}

.view-btn,
.cart-btn{

    border:none;

    padding:12px 18px;

    border-radius:8px;

    color:white;

    cursor:pointer;

    font-size:15px;
}

.view-btn{

    background:#2563eb;
}

.cart-btn{

    background:#111827;
}

.view-btn:hover{

    background:#1d4ed8;
}

.cart-btn:hover{

    background:black;
}

/* EMPTY */

.empty{

    text-align:center;

    margin-top:100px;

    font-size:28px;

    color:#666;
}
</style>

</head>

<body>

<!-- HEADER -->

<div id="header"></div>

<!-- TITLE -->

<h1 class="page-title">
    My Wishlist
</h1>

<!-- WISHLIST ITEMS -->

<div id="wishlistContainer"></div>

<!-- LOAD HEADER -->

<script>

fetch("./header.html")

.then(response => response.text())

.then(data => {

    document.getElementById("header")
            .innerHTML = data;

    updateCartCount();

    updateWishlistCount();
    updateOrdersCount();
});

</script>

<script src="js/header.js"></script>

<script src="js/product.js"></script>

<script src="js/wishlist.js"></script>

</body>

</html>
